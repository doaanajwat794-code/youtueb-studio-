# Face Not Recognized — storyboard v3 (edit order, 12 shots). Total 56.7 s. ALL shots: Veo 3.1 Fast in Flow, 9:16, 8 s.
# `seconds` = what we use from each 8-second clip; `trim_start` skips the first frames.
#
# THE RULE THE AUDIENCE LEARNS VISUALLY (v2, owner continuity fixes 2026-09-24):
#   • Blue ring glowing in her iris = the AR lens is working = Elise sees her 37-year-old face.
#   • Ring drops out (even for a second) = she sees the truth (67).
#   • Her phone and door recognise her through the PAIRED LENS. Their cameras see her real face,
#     but her enrolled face is still the 37-year-old one. When the lens fails, pairing fails and
#     the real 67-year-old face doesn't match → "Face not recognized". (Shown by the on-screen
#     interface text "Paired lens: not detected" / "Lens paired ✓", plus Theo's line.)
#   • The lens malfunctions INTERMITTENTLY (S01 weak → S04 stutters → S06 drops out → S07 flickers
#     back) and is REPLACED in S10–S11 (v3: fingertip approaches the eye → CUT → two blinks → ring
#     powers on; the insertion itself is never shown), so the young face in S12 is logically restored.
# POV: we see Elise as SHE sees herself, except S06 (the lens drops out) and S09–S11 (her true age).

shots:
  - id: S01
    beat: hook
    seconds: 5.0
    trim_start: 2.6   # FNR_S01_v1 (2026-09-27): red light hits at 4.0 s in the clip -> 1.4 s into the shot, on the error overlay
    tier: standard
    characters: [elise_young]
    location: corridor
    camera: extreme close-up at eye level, very slow push-in, her face in the upper third of the frame, the edge of the phone visible at the bottom
    prompt: >-
      Extreme close-up of Elise's face at night in her apartment corridor, lit from below by the
      cold white glow of the smartphone she raises to her face. The very thin electric-blue ring
      around the edge of her iris glows weakly and flickers once. The phone's light suddenly turns a
      pulsing red that washes over her skin. Her eyes narrow and her lips part in confusion; she
      tilts the phone slightly and tries again.
    flow_notes: The phone screen must face HER; the "Face not recognized" message is added in the edit.
    native_audio_db: -20
    sfx:
      - {file: lens_crackle.wav, offset: 0.8, gain_db: -18}
      - {file: ui_error.wav, offset: 1.4, gain_db: -10}

  - id: S02
    beat: rule
    seconds: 6.0
    trim_start: 0.7   # FNR_S02_v1 (2026-09-27): ring blue at 1.8 s, amber at 3.3 s, she turns away at 6.7 s
    tier: standard
    characters: [elise_young]
    location: corridor
    camera: medium shot from the side at shoulder height, smooth slow tracking alongside her, settling as she stops
    prompt: >-
      Elise walks along the corridor to her dark walnut apartment door, stops, and looks directly
      into the round camera lens of the slim black facial-recognition panel beside the door. The thin
      light ring around the panel's lens flickers soft blue for a moment, as if searching, then turns
      amber. She presses the matte black door handle; it does not move. She frowns and tries once more.
    native_audio_db: -20
    sfx:
      - {file: ui_scan.wav, offset: 1.1, gain_db: -12}
      - {file: ui_deny.wav, offset: 2.6, gain_db: -10}

  - id: S03
    beat: clue
    seconds: 4.5
    trim_start: 2.0   # FNR_S03_v2 (2026-09-27): she leans in 3-6 s; cooler grade than S01/S02 (match in the edit)
    tier: standard
    characters: [elise_young]
    location: corridor
    camera: static medium close-up from the side at eye level, Elise in three-quarter profile on the right of the frame, the small wall panel on the left; the camera does not move toward or through the panel
    prompt: >-
      Elise stands beside her apartment door, facing the small doorbell-sized black facial-recognition
      panel mounted on the teal-grey wall at eye level. The thin light ring around the panel's tiny
      round camera glows a steady amber and pulses slowly. She leans a little closer to the panel and
      stares into it, unblinking, confused, her lips slightly parted. Her face is faintly reflected in
      the panel's small blank dark-glass screen. The panel stays small on the wall, about the size of
      her hand; it is not a ring light, not a lamp and not a mirror.
    flow_notes: "v2 prompt (2026-09-27): v1 turned the panel into a giant ring light and mirrored her face. The panel's screen must stay blank; the 'Estimated age 67' text is added in the edit."
    native_audio_db: -20

  - id: S04
    beat: lens_intermittent
    seconds: 4.5
    trim_start: 1.5   # FNR_S04_v1 (2026-09-27): stutters 1.6-2.9 s, off 3.7-5.7 s (slow blink), back weak at 5.75 s with fingertip
    tier: standard
    characters: [elise_young]
    location: corridor
    camera: extreme macro close-up of one eye, locked off, perfectly still
    prompt: >-
      Extreme macro close-up of Elise's left grey-green eye in warm amber corridor light, the eye
      filling most of the frame. She wears a smart contact lens: a thin, clearly visible glowing
      electric-blue neon ring traces the outer edge of her iris, like a tiny digital halo. The blue
      ring stutters like a failing screen: it blinks off, struggles back on, blinks off again, then
      returns weaker and unstable, flickering. She blinks slowly and a fingertip rises into frame to
      touch the outer corner of her eye, without touching the eyeball.
    flow_notes: "Add ONLY the Elise Young character as ingredient (no corridor image) so Veo stays on the eye. The ring must come BACK on at the end (weak and flickering), not stay off. If the eye looks distorted, try Text to Video with the same prompt."
    native_audio_db: -24
    sfx:
      - {file: lens_crackle.wav, offset: 0.1, gain_db: -8}
      - {file: lens_crackle.wav, offset: 4.2, gain_db: -12}

  - id: S05
    beat: mirror_young
    seconds: 3.5
    trim_start: 0.0   # FNR_S05_v1 (2026-09-27): static, no hand until 3.5 s; end frame -> media/FNR/FNR_S05_ENDFRAME.png for S06
    tier: standard
    characters: [elise_young]
    location: corridor
    camera: medium close-up looking into the full-height mirror, over Elise's shoulder, static; her reflection faces the camera
    prompt: >-
      Over Elise's shoulder, looking into the full-height mirrored wall panel beside the elevator.
      Her reflection faces the camera: the young woman with dark chestnut hair and the cream
      turtleneck, a faint unstable blue ring glowing in the irises of her reflected eyes. She studies
      her own face, uneasy.
    flow_notes: S05 and S06 must use the SAME framing (same distance, height and angle) so the cut between them reads as one continuous moment.
    native_audio_db: -20

  - id: S06
    beat: mirror_truth
    seconds: 1.0
    trim_start: 0.0   # FNR_S06_v1 = Claude-built 2 s clip from FNR_S06_STILL.png (Flow edit A of the S05 end frame + S05's brown foreground hair), slow push-in, sconce flicker
    tier: standard
    characters: [elise_old]
    location: corridor
    camera: medium close-up looking into the full-height mirror, over Elise's shoulder, static; same framing as the previous shot
    prompt: >-
      Over Elise's shoulder, looking into the full-height mirrored wall panel beside the elevator.
      The reflection shows Elise at 67 with silver-white hair in the identical cream cable-knit
      turtleneck, standing in the same pose, staring back with wide, frightened eyes. There is no
      blue glow in her eyes. The brass sconce light flickers.
    flow_notes: "Same framing as S05: in Flow IMAGE mode, upload FNR_S05_ENDFRAME.png, add the Elise Old character, and edit the frame so both the reflection and the foreground woman are Elise at 67 (see chat 2026-09-27). The edited still is used for 1 s with a flicker added in the edit; animate it with Frames to Video only if it looks too static."
    native_audio_db: null
    sfx:
      - {file: mirror_shimmer.wav, offset: 0.0, gain_db: -6}

  - id: S07
    beat: lens_returns
    seconds: 4.0
    trim_start: 0.0   # v1 rejected (neon glow, nose piercing, pull-back). v3 = v2 (2.0-6.0 s) + Claude post: tracked faint lens ring, misplaced mole removed (tools/s07_lensfx.py)
    tier: standard
    characters: [elise_young]
    location: corridor
    camera: tight close-up at eye level, static, stays close for the whole shot; no pull-back, no zoom out, the mirror is not visible
    prompt: >-
      Tight close-up of Elise's face, shoulders up, in shock after looking in the mirror, her breath
      catching. In both eyes a very thin, faint electric-blue line flickers back on around the outer
      edge of the iris only, weak and unstable, subtle like a contact lens reflection; the rest of the
      eye stays natural grey-green and does not glow. One hand rises into the close-up to cover her
      mouth, and the thin gold wedding band on her finger catches the amber light. Her eyes glisten.
      No nose piercing, no facial piercings, no jewellery other than small silver hoop earrings and
      the gold wedding band.
    native_audio_db: -20
    sfx:
      - {file: lens_crackle.wav, offset: 0.25, gain_db: -14}

  - id: S08
    beat: arrival
    seconds: 6.0
    trim_start: 0.2   # FNR_S08_v1 (2026-09-27): doors already open at 0 s, Theo walks toward her with the white case; passes her after 7 s (excluded)
    tier: standard
    characters: [elise_young, theo]
    location: corridor
    camera: over-the-shoulder medium-wide from behind Elise, static, rack focus from her hair to the elevator
    prompt: >-
      From behind Elise's shoulder, her dark chestnut hair soft in the foreground, the brushed-steel
      elevator doors at the end of the corridor slide open and warm light spills out. Theo steps out
      holding a small white contact-lens case. He sees her, stops, and his worried face softens with
      quiet sadness as he walks slowly toward her.
    native_audio_db: -18
    sfx:
      - {file: elevator_ding.wav, offset: 0.05, gain_db: -10}

  - id: S09
    beat: twist
    seconds: 7.0
    trim_start: 1.0   # FNR_S09_v1 (2026-09-27): Theo's back hides her until ~2.2 s, she is revealed crying at 67, phone to chest; his profile edge only at the end
    tier: standard
    characters: [elise_old, theo]
    location: corridor
    camera: reverse over-the-shoulder medium close-up from behind Theo, static, very slow push-in toward Elise
    prompt: >-
      Reverse over-the-shoulder shot from behind Theo, the back of his head and navy wool coat soft in
      the foreground. He faces Elise, now clearly seen at her true age of 67 with silver-white hair,
      standing in the corridor clutching her phone to her chest, frightened and searching his face.
      Her eyes are natural grey-green with no glow at all. Theo's head tilts gently toward her; we
      never see his face. The corridor is quiet. She slowly lowers the phone, her eyes filling
      with tears. Theo keeps his back to the camera for the whole shot.
    flow_notes: Theo must stay turned away from camera (back of head) so no lip-sync is needed.
    native_audio_db: -22
    sfx:
      - {file: sting.wav, offset: 0.0, gain_db: -4}

  - id: S10
    beat: lens_approach
    seconds: 3.85
    trim_start: 0.0   # FNR_S10_v1 (2026-09-27): looks at the case 0-3.2 s, lifts a lens 3.5 s, lens a few cm from the eye at 3.85 s, touches at 4.0 s -> cut at 3.85
    tier: standard
    characters: [elise_old]
    location: corridor
    camera: close-up at eye level, static, shallow focus on her face, the lens case soft in the foreground
    prompt: >-
      Close-up of Elise at 67 in the warm corridor light, tears in her grey-green eyes. In the
      soft-focus foreground a man's hand in a navy wool coat sleeve holds open a small white
      contact-lens case with two clear lenses that have a faint blue rim. She lifts one lens on the
      tip of her index finger and slowly raises it toward her eye, her gaze following it. The lens
      stays a few centimetres away from her eye.
    flow_notes: "v3: the lens must NOT touch the eye. We cut away while her fingertip is still approaching (that cut hides the insertion)."
    native_audio_db: -22

  - id: S11
    beat: lens_power_on
    seconds: 3.4
    trim_start: 0.5
    tier: standard
    characters: [elise_old]
    location: corridor
    camera: extreme macro close-up of one eye, locked off, perfectly still
    prompt: >-
      Extreme macro close-up of Elise's left grey-green eye at 67, fine wrinkles around it, in warm
      amber corridor light. No hands or fingers in frame. She blinks slowly twice. Then a very thin
      electric-blue ring lights up around the outer edge of her iris, traces all the way around it,
      and glows steady and bright. Her eye relaxes.
    flow_notes: "v3: no fingers in this shot. The key moment is the blue ring switching ON after the two blinks."
    native_audio_db: -24
    sfx:
      - {file: lens_boot.wav, offset: 1.4, gain_db: -10}

  - id: S12
    beat: echo
    seconds: 7.6
    trim_start: 0.3
    tier: standard
    characters: [elise_young]
    location: corridor
    camera: extreme close-up at eye level, very slow push-in, framed exactly like the opening shot, face in the upper third
    prompt: >-
      Extreme close-up of Elise's face at night, lit from below by her smartphone held at face
      height, exactly like the opening shot. The thin electric-blue ring around her irises glows
      steady and bright. The phone's light turns a soft calm green on her skin. A single tear runs
      down her cheek and a faint, peaceful smile forms.
    native_audio_db: -20
    sfx:
      - {file: ui_unlock.wav, offset: 1.2, gain_db: -10}
      - {file: door_click.wav, offset: 2.0, gain_db: -8}

# Interface text added in the edit (Flow is told NOT to render text). This carries the world rule.
overlays:
  - {text: "✕  Face not recognized", style: alert, at_shot: S01, offset: 1.4, duration: 3.4, y: 0.30}
  - {text: "Paired lens: not detected", style: info, at_shot: S02, offset: 1.2, duration: 1.4, y: 0.30}
  - {text: "Unknown visitor · Access denied", style: alert, at_shot: S02, offset: 2.6, duration: 3.2, y: 0.30}
  - {text: "Estimated age: 67", style: info, at_shot: S03, offset: 0.4, duration: 3.9, y: 0.30}
  - {text: "✓  Lens paired\nWelcome home, Elise", style: success, at_shot: S12, offset: 1.2, duration: 3.8, y: 0.30}

audio:
  lines:        # narrator = Elise (voice-narrator.txt), theo = Theo (voice-theo.txt)
    - {id: N01, type: narration, speaker: narrator, at_shot: S01, offset: 0.4, text: "My phone stopped recognizing my face tonight."}
    - {id: N02, type: narration, speaker: narrator, at_shot: S02, offset: 1.2, text: "Then my own front door."}
    - {id: N03, type: narration, speaker: narrator, at_shot: S03, offset: 1.8, text: "I'm thirty-seven."}
    - {id: N04, type: narration, speaker: narrator, at_shot: S04, offset: 0.5, text: "Then my eye started to flicker."}
    - {id: N05, type: narration, speaker: narrator, at_shot: S05, offset: 0.2, text: "The mirror was always kind to me."}
    - {id: N06, type: narration, speaker: narrator, at_shot: S07, offset: 0.6, text: "That woman wore my sweater. My ring. My eyes."}
    - {id: D01, type: dialogue, speaker: theo, at_shot: S09, offset: 0.8, text: "Mum… the lenses died again."}
    - {id: D02, type: dialogue, speaker: theo, at_shot: S09, offset: 3.3, text: "Everything's still set to the face you remember."}
    - {id: N07, type: narration, speaker: narrator, at_shot: S12, offset: 0.4, text: "Thirty years ago, I chose the face I'd keep."}
    - {id: N08, type: narration, speaker: narrator, at_shot: S12, offset: 4.6, text: "Tonight, I chose it again."}
  music:        # free YouTube Audio Library tracks (owner downloads; see production guide)
    - {id: M01, start_shot: S01, end_shot: S08, gain_db: -18}   # tense, minimal, pulsing; fades out before the twist
    - {id: M02, start_shot: S10, end_shot: S12, gain_db: -17}   # soft, emotional piano from the moment she takes the lens
