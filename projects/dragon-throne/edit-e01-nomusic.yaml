# DRAGON THRONE E01 — FIRE vs ICE. v2 (owner 2026-10-06): the old synth score was annoying → new orchestral-style
# war score (score_style: epic); slowed clip audio muted (that warped sound at the start); scenes cut on matching
# motion so the fight reads as one battle: C01 → C06 (above the clouds) → C02 → C03 → C04 → C05 → C07 (victory).
clips_dir: media/DT/incoming
work_dir: media/DT/work_e01_nm
output: media/DT/DT_E01_FINAL_v3_nomusic.mp4  # v3: no music, the owner adds licensed music in-app
smooth: true
transition_sfx: false
ambience_gain: 0
score_style: epic
clip_gain: 0.8
music_gain: 0
# the Flow explosions + booms are mostly sub-bass: cut rumble, add presence so it plays well on phones
final_eq: "highpass=f=45,bass=g=-7:f=140,treble=g=3:f=3000"
segments:
  - {gain: 0, file: DT_E01_C01_v1.mp4, in: 4.1, out: 5.0, speed: 0.55, flash: true, note: "HOOK: fire and ice beams collide (slow-mo, music + boom only)"}
  - {tr: flash, file: DT_E01_C01_v1.mp4, in: 0.0, out: 2.0, speed: 1.25, note: "IGNAR breathes fire"}
  - {tr: whip, file: DT_E01_C01_v1.mp4, in: 2.2, out: 4.1, speed: 1.25, note: "SYLVRA answers with ice"}
  - {tr: cut, file: DT_E01_C01_v1.mp4, in: 4.1, out: 7.2, speed: 1.15, flash: true, note: "collision, face to face"}
  - {tr: cut, file: DT_E01_C06_v1.mp4, in: 0.0, out: 7.9, speed: 1.2, note: "claws locked, spin, tails, point-blank blast"}
  - {tr: flash, file: DT_E01_C02_v1.mp4, in: 2.2, out: 7.5, speed: 1.25, note: "thrown apart, the sky chase"}
  - {tr: flash, file: DT_E01_C03_v1.mp4, in: 0.2, out: 7.9, speed: 1.3, note: "IGNAR dives, fire hits her"}
  - {tr: whip, file: DT_E01_C04_v1.mp4, in: 0.6, out: 4.6, speed: 1.3, flash: true, note: "IGNAR slams onto the summit"}
  - {tr: cut, file: DT_E01_C04_v1.mp4, in: 5.2, out: 7.9, speed: 1.15, note: "she pounces, fire barrage, she escapes up"}
  - {tr: whip, file: DT_E01_C05_v1.mp4, in: 0.6, out: 3.2, speed: 1.2, note: "IGNAR roars fire to the sky"}
  - {tr: flash, gain: 0.3, file: DT_E01_C05_v1.mp4, in: 3.2, out: 5.0, speed: 0.7, flash: true, note: "THE FREEZE (slow-mo)"}
  - {tr: cut, gain: 0, file: DT_E01_C05_v1.mp4, in: 5.0, out: 5.9, speed: 0.6, note: "SYLVRA above the frozen IGNAR"}
  - {tr: flash, gain: 0.8, file: DT_E01_C07_v1.mp4, in: 3.0, out: 5.4, speed: 1.1, note: "she lands and roars a column of ice"}
  - {tr: dissolve, trd: 0.3, gain: 0.5, file: DT_E01_C07_v1.mp4, in: 6.2, out: 7.9, push: 0.0012, note: "lightning: the next challenger in the sky"}
drum_hits: ["0", "3+0.3", "4+5.6", "5+0", "6+1.8", "7+0.8", "9+1.6"]
mute_from: "10"
music_resume: "11"
sfx:
  - {type: boom, at: "0", gain: 0.8}
  - {type: boom, at: "3+0.3", gain: 0.9}
  - {type: boom, at: "4+5.6", gain: 0.9}
  - {type: boom, at: "7+0.8", gain: 1.0}
  - {type: boom, at: "10", gain: 0.9}
  - {type: boom, at: "12", gain: 1.0}
text:
  - {at: "0", dur: 1.6, style: hook, text: "FIRE vs ICE", y: 0.17}
  - {at: "1+0.2", dur: 1.3, style: name, text: "IGNAR", y: 0.15}
  - {at: "1+0.2", dur: 1.3, style: title, text: "THE LIVING VOLCANO", y: 0.205}
  - {at: "2+0.1", dur: 1.3, style: name, text: "SYLVRA", y: 0.15}
  - {at: "2+0.1", dur: 1.3, style: title, text: "THE FROST QUEEN", y: 0.205}
  - {at: "6+2.5", dur: 1.4, style: hook, text: "WHO WINS?", y: 0.17}
  - {at: "12+0.3", dur: 1.8, style: end, text: "SYLVRA WINS", y: 0.15}
  - {at: "13+0.1", dur: 1.6, style: end, text: "NEXT:\nTHE STORM SERPENT", y: 0.15}
