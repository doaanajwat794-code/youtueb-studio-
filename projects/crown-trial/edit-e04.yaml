  - {tr: flash, gain: 1.3, file: CT_E04_C05_v1a.mp4, in: 0.5, out: 8.4, push: 0.0008, note: "kneeling, rips off the mask: Kharun 'Finally... a worthy king.'"}
  - {tr: dissolve, trd: 0.5, file: CT_E04_WIDE_KHARUN.jpg, in: 0, out: 3.2, push: 0.0012, note: "closing wide: the new king"}
