# Episode 4 — THE CROWN DUEL (finale). 5 continuous Flow clips (10 s each) + closing wide still.
clips_dir: media/CT/incoming
work_dir: media/CT/work_e04
output: media/CT/CT_E04_FINAL_v2.mp4  # v2: fighter-swap in C02 cut out
smooth: true
transition_sfx: false
ambience_gain: 0
clip_gain: 0.5
music_gain: 0.55
segments:
  - {file: CT_E04_C04_v2.mp4, in: 4.4, out: 5.3, speed: 0.6, flash: true, note: "COLD OPEN: the mask cracks (flash-forward)"}
  - {tr: flash, gain: 0.8, file: CT_E04_C01_v2.mp4, in: 0.3, out: 8.3, note: "Champion drops in: 'Kneel, tiger.' + first exchange"}
  - {tr: whip, file: CT_E04_C02_v2.mp4, in: 0.0, out: 2.7, note: "three-strike combo"}
