  - {type: boom, at: "3+0.85", gain: 0.9}
  - {type: boom, at: "5+1.5", gain: 0.8}
  - {type: boom, at: "6", gain: 1.1}
  - {type: boom, at: "7+0.3", gain: 1.0}
