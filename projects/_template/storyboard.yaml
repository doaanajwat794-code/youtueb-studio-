# {{title}} — Storyboard (10–12 shots, total 55–60 s). Order = edit order. Ids unique.
# tier: hero → Flow 'Quality' (hook, twist, key close-ups); standard → Flow 'Fast'. Clips are 8 s; `seconds` is what we use.
shots:
  - id: S01
    beat: hook
    seconds: 2.5
    trim_start: 0.3
    tier: hero
    location: loc1
    characters: [lead]
    camera: "extreme close-up, vertical 9:16, slow push-in, face in upper third"
    flow_mode: Ingredients to Video   # or Text to Video / Frames to Video
    flow_notes: ""                    # extra instruction for the owner in Flow
    prompt: >-
      (one subject, one action, one moment)
    native_audio_db: -16   # optional: keep the Flow clip's own ambience/SFX under the mix
    sfx: []
audio:
  lines:
    - id: N01
      type: narration
      speaker: narrator
      at_shot: S01
      offset: 0.3
      text: >-
        (first line — starts within 0.5 s)
  music:
    - id: M01              # free YouTube Audio Library track saved as media/<slug>/audio/music/M01.wav
      start_shot: S01
      end_shot: S01
      gain_db: -16
