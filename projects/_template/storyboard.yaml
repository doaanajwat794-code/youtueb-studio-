# {{title}} — Storyboard (10–12 shots, total 55–60 s). Order = edit order. Ids unique.
# tier: hero ($0.40/s Veo 3.1) for hook, face close-ups, twist; standard ($0.15/s Veo 3.1 Fast) otherwise.
shots:
  - id: S01
    beat: hook
    seconds: 2.5
    trim_start: 0.3
    tier: hero
    location: loc1
    characters: [lead]
    camera: "extreme close-up, vertical 9:16, slow push-in, face in upper third"
    prompt: >-
      (one subject, one action, one moment)
    native_audio_db: -16   # optional: keep Veo's own ambience/SFX under the mix
    sfx: []
audio:
  lines:
    - id: N01
      type: narration
      speaker: narrator
      at_shot: S01
      offset: 0.3
      text: >-
        (first line — starts within 0.5 s)
  music:
    - id: M01              # free YouTube Audio Library track saved as media/<slug>/audio/music/M01.wav
      start_shot: S01
      end_shot: S01
      gain_db: -16
