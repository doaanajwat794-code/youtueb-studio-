# Twist Villa — channel identity and content direction
# Status: APPROVED by the owner 2026-09-24 (Shorts pivot). Long-form settings are archived
# in archive/longform/ and must not be used unless the owner explicitly asks.
status: approved

channel:
  name: Twist Villa
  handle: "@TwistVela"
  url: https://www.youtube.com/@TwistVela
  language: en
  promise: >-
    60-second cinematic stories about identity and technology — every one ends with a
    twist that makes you watch it again.

format:
  type: shorts                 # YouTube Shorts ONLY
  min_seconds: 55
  max_seconds: 60
  target_seconds: 58
  aspect_ratio: "9:16"
  resolution: 1080x1920
  frame_rate: 24
  long_form: false             # do not produce long-form unless the owner explicitly asks

genres:
  primary: [cinematic mystery, psychological thriller, science fiction]
  theme: human identity and technology
  avoid: [gore, real people or real brands, real tragedies, political content, kids-targeted content]

production:
  footage: fully AI-generated moving video (no still-image slideshows, no repeated shots)
  audio: original narration, sound effects, music
  editing: cinematic cuts, burned-in captions, loudness-normalised mix

audience:
  who: English-speaking viewers 16–44 who like Black Mirror, Twilight Zone, sci-fi and mystery
  watch_context: phone, vertical, often sound-on; decides to stay or swipe in ~2 seconds

signature_elements:
  - A striking, unexplained image in the first 1–2 seconds
  - One central character, same face and wardrobe in every shot
  - A single "rule" of the world that the twist turns inside-out
  - One planted clue that the twist pays off
  - Final shot that echoes the first shot (encourages a re-watch / loop)
  - Twist Villa look: teal–amber grade, shallow depth of field, soft film grain

cadence:
  target: 3–5 Shorts per month (fits the $50–150 monthly budget)

disclosure:
  youtube_altered_or_synthetic_toggle: true   # realistic AI humans → disclose
  description_note: "Made with AI tools. Original story by Twist Villa."
