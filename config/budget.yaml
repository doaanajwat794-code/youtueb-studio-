# Budget and cost limits — enforced by studio/budget.py
# Status: APPROVED 2026-09-24 — produce with existing subscriptions (Google Flow, ShortsFaceless).
# Extra spend target is $0 per Short. The caps below are only a safety net for any paid API call
# the owner explicitly approves; nothing is charged without a recorded approval.
status: approved
currency: USD
additional_spend_target_usd_per_short: 0
subscriptions_in_use: [Google Flow, ShortsFaceless (30 videos/month)]

caps:
  per_video_usd: 5          # safety net: max extra API spend per Short, only with approval
  per_month_usd: 20         # safety net: max extra API spend per month, only with approval
  pilot_usd: 0              # pilots happen in Flow (subscription credits)
  single_call_usd: 5        # any single API call estimated above this is refused (safety net)

approval:
  required_for_every_paid_stage: true   # an approval must be recorded per stage
  overrun_tolerance_pct: 10             # stop the stage if actual spend exceeds approval by >10 %
  approver: channel owner

free_actions:   # never need approval
  - research via web search
  - writing ideas, scripts, bibles, storyboards, metadata drafts
  - local editing / assembly / subtitle generation with FFmpeg
  - YouTube Data API reads and private uploads (free quota, no money)

estimation:            # assumptions used by `python -m studio estimate`
  retake_rate: 0.30    # extra generations for rejected shots (30 %)
  refs_images_per_character: 4
  refs_images_per_location: 2
  thumbnail_candidates: 0      # Shorts use a frame from the video; no paid thumbnail
  pilot_seconds: 12            # pilot = first ~12 s (≈3 shots); reused in the final cut
  words_per_minute: 150
  tts_tokens_per_second: 25
