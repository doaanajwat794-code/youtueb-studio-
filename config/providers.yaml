# Production tools and render settings
# Status: Shorts settings 2026-09-24 (9:16, 1080x1920). Paid adapters are still UNTESTED.
# Prices were gathered 2026-09-23 from web search results (official pricing pages were
# unreachable from the research environment). Re-check official pages before approving spend.
# Per-provider "status": UNTESTED -> TESTED (after a real successful run) -> APPROVED (owner ok).

primary_stack: owner_subscriptions   # APPROVED 2026-09-24: use Google Flow + ShortsFaceless, no paid video API

providers:
  video:
    primary:                       # APPROVED 2026-09-24 — manual generation by the owner
      name: Google Flow (owner's paid subscription; Veo 3.1 inside Flow)
      how: "Claude writes flow-prompts.md → owner generates in Flow → downloads → names CODE_SNN_vN.mp4 → hands over"
      extra_cost_usd: 0            # covered by the subscription (uses Flow credits)
      aspect_ratio: "9:16"         # set Portrait/9:16 in Flow before generating
      clip_seconds: 8
      outputs_per_prompt: 1
      models: {hero: "Veo 3.1 Quality", standard: "Veo 3.1 Fast"}
      default_model: "Veo 3.1 Fast"   # APPROVED 2026-09-24: Fast for ALL shots; Quality only with owner approval
      credits_per_generation: {quality: 100, fast: 20}   # web-reported 2026 (Fast may be 10 on Ultra); check in Flow
      monthly_credits_note: "Google AI Pro ≈ 1,000 credits/month, Ultra 12,500–25,000 (web-reported). Check your balance in Flow."
      consistency_tools: [Ingredients to Video (up to 3 reference images), Frames to Video, same prompt locks]
      download: "Highest resolution Flow offers (1080p if available); 720p is upscaled by our pipeline"
      status: MANUAL_UNTESTED      # becomes TESTED after the first real clips import cleanly
    api_optional:                  # NOT USED — kept only if the owner ever approves pay-per-use API
      name: Google Veo 3.1 (Gemini API)
      api: generativelanguage.googleapis.com
      models:
        hero: veo-3.1-generate-preview
        standard: veo-3.1-fast-generate-preview
      clip_seconds: 8
      resolution: 1080p
      aspect_ratio: "9:16"
      usd_per_second: {hero: 0.40, standard: 0.15}   # web-reported
      status: DISABLED_BY_OWNER    # owner: "do not require a new Veo API subscription"
    not_selected:
      - name: OpenAI Sora 2 API
        reason: "API reported to shut down 2026-09-24"
      - name: Kling / Runway / Seedance APIs
        reason: "Extra paid services; owner prefers existing subscriptions"

  images:        # character sheets, location plates, first frames, thumbnail
    name: Gemini 3 Pro Image ("Nano Banana Pro")
    model: gemini-3-pro-image-preview       # verify exact id at setup
    usd_per_image: 0.134          # 1K/2K; batch ~0.067 (web-reported)
    status: UNTESTED

  narration_and_dialogue:
    plan: "APPROVED 2026-09-24: Google voice ONLY if free. Order: google_vids → gemini free tier (owner OK) → owner's recording / ShortsFaceless."
    google_vids:
      how: "Owner pastes voice-<speaker>.txt into a Google Vids AI voiceover, downloads, names CODE_VOICE_<SPEAKER>_v1.mp4; import-clips splits it"
      cost: "0 (Google account; usage limits depend on the owner's plan)"
      status: UNVERIFIED_FOR_OWNER_ACCOUNT
    google_cloud_tts:
      status: NOT_ALLOWED   # needs a billing account + card and charges above the free quota
    option_1_shortsfaceless:
      how: "Owner pastes narration.txt as a Custom Script in ShortsFaceless, picks the chosen voice, downloads; we run import-voice"
      cost: "1 of the owner's 30 monthly ShortsFaceless videos"
      caveat: "Only usable if the export has no background music (or music can be turned off)"
      status: UNTESTED
    option_2_gemini_tts_free_tier:
      how: "Free Google AI Studio key (no billing). Free-tier inputs may be used by Google to improve products; narration text is not sensitive."
      cost: 0
      status: UNTESTED
    option_3_owner_recording:
      how: "Owner records narration on a phone; we run import-voice"
      cost: 0
    primary:
      name: Gemini TTS (Gemini API)
      model: gemini-2.5-pro-preview-tts     # verify exact id at setup
      usd_per_million_output_tokens: 20.0   # ~25 tokens per audio second → ~$0.03 per minute
      status: UNTESTED
    premium_option:
      name: ElevenLabs (v3 / Multilingual v2)
      note: "Commercial rights need a paid subscription (Starter ~$6/mo+); pay-as-you-go API has no commercial licence per reports"
      reachable_from_cloud_env: false
      status: UNTESTED

  music:
    primary:
      name: YouTube Audio Library (free, cleared for YouTube use)
      how: "Owner or session downloads a track into media/<slug>/audio/music/; record title + licence in metadata"
      cost: 0
    optional:
      name: Google Lyria 3 Pro / 3.5 (Gemini API)
      usd_per_track: 0.08          # web-reported
      status: NOT_BUILT            # request format to be confirmed from official docs

  sound_effects:
    plan: "Veo native audio (included in the Veo price) per shot via storyboard native_audio_db, plus free YouTube Audio Library / CC0 SFX"

  owner_subscriptions:            # APPROVED 2026-09-24
    google_flow:
      status: active_paid
      role: "ALL video footage — owner generates manually from flow-prompts.md"
      also_useful_for: "reference images (character sheets, location plates) inside Flow"
      api: none_used                # no automation of the Flow website
    shortsfaceless:
      url: https://www.shortsfaceless.com/
      status: active
      plan: "30 videos per month (owner-confirmed 2026-09-24)"
      api: none_found               # no public API found; assume no API access
      integration: manual_only
      allowed_roles:
        - "narration voice: paste narration.txt as a Custom Script, export with music off, then import-voice (uses 1 of 30/month)"
        - "optional idea brainstorming (ideas must still pass our originality check)"
      not_allowed_roles:
        - "footage: animated still images are never used as Twist Villa footage"
        - "final edit/captions/posting: our pipeline does these on the Flow footage"
      status_check: "dashboard checklist still open: music-off export? voice-only download?"

  script_and_planning:
    name: Claude (this Claude Code session)
    cost: "Included in the owner's Claude plan — no extra API charge"

  subtitles_alignment:
    name: "Script-driven SRT timed from TTS segment durations (free); optional Whisper-style alignment later"

  editing:
    name: FFmpeg (open source, free)
    status: TESTED_WITH_PLACEHOLDERS   # see state/STATUS.md for the test record

render:                       # YouTube Shorts master
  width: 1080
  height: 1920
  fps: 24
  video_codec: libx264
  crf: 18
  preset: slow
  pixel_format: yuv420p
  audio_codec: aac
  audio_bitrate: 320k
  audio_sample_rate: 48000
  loudness_lufs: -14            # integrated loudness target for final master
  subtitles:
    sidecar_srt: true          # also uploaded as YouTube captions
    burn_in: true              # Shorts: captions baked into the picture
    font: DejaVu Sans
    font_size: 10              # libass units (PlayResY 288) — ~67 px on a 1920-px-tall frame
    margin_v: 70               # keeps captions above the Shorts UI at the bottom
    max_chars_per_line: 26

youtube:
  api: YouTube Data API v3
  auth: OAuth 2.0 (installed/desktop app), scope youtube.upload (+ youtube.force-ssl for captions)
  default_privacy: private
  status: UNTESTED
